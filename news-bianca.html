<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virgin Active Brescia — News bianca</title>
  <style>
    @font-face { font-family: Gotham; src: url('./fonts/Gotham-Bold.otf') format('opentype'); font-weight: 700; font-display: swap; }
    @font-face { font-family: Gotham; src: url('./fonts/Gotham-Book.otf') format('opentype'); font-weight: 400; font-display: swap; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #fff url('./sfondo.jpg') center center / 100% 100% no-repeat;
      color: #090909;
      font-family: Gotham, Arial, sans-serif;
    }
    /* L'area di testo termina prima della fascia rossa e della sua sfumatura. */
    .news-panel {
      position: absolute;
      left: 10%; top: 10%; width: 80%; height: 59%;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .title-box { width: 100%; height: clamp(64px, 6.6vw, 145px); flex: none; overflow: hidden; margin-bottom: clamp(14px, 2.2vh, 28px); }
    .title {
      font-size: clamp(36px, 5.2vw, 112px);
      font-weight: 700; line-height: 1.12; letter-spacing: -0.035em;
      overflow-wrap: break-word; margin: 0;
    }
    .description-box { flex: 1; min-height: 0; overflow: hidden; }
    .description {
      font-size: clamp(20px, 2.55vw, 48px);
      font-weight: 400; line-height: 1.22; letter-spacing: 0;
      overflow-wrap: break-word;
      white-space: pre-line; /* Conserva gli a capo manuali di Google Sheets */
    }
    /* Dimensione standard; il testo si riduce solo se non entra nell’area bianca. */
    .title, .description { opacity: 0; transform: translateY(14px); }
    .title.show { animation: enter .45s cubic-bezier(.22,.8,.2,1) both; }
    .description.show { animation: enter .38s ease .12s both; }
    @keyframes enter { to { opacity: 1; transform: translateY(0); } }
    @media (orientation: portrait) {
      .news-panel { left: 9%; width: 82%; top: 10%; height: 57%; }
      .title { font-size: clamp(30px, 7.2vw, 90px); }
      .description { font-size: clamp(18px, 4.4vw, 46px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .title.show, .description.show { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="news-panel" aria-live="polite">
    <div class="title-box" id="titleBox"><h1 class="title" id="title"></h1></div>
    <div class="description-box" id="descriptionBox"><div class="description" id="description"></div></div>
  </main>
  <script>
    // Dati condivisi con la pagina nera. Nessuna modifica a index.html.
    const API_URL = 'https://script.google.com/macros/s/AKfycbybpwUuhjoKeGN5Lu57HgkAw3e5xfGGQ1HkZdj8D2RQ7rnjTUByejbVVfnKnQa31Hvj/exec';
    const CACHE_KEY = 'news_cache_va_brescia';
    const MIN_TIME = 6000;
    const MAX_TIME = 12000;
    let news = [];
    let current = 0;
    let rotateTimeout = null;
    const titleEl = document.getElementById('title');
    const descEl = document.getElementById('description');
    const descBox = document.getElementById('descriptionBox');

    function plainText(raw) {
      return String(raw ?? '')
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/(p|div|li)>/gi, '\n')
        .replace(/<[^>]*>/g, '')
        .replace(/&nbsp;/gi, ' ')
        .replace(/&amp;/gi, '&')
        .replace(/&lt;/gi, '<')
        .replace(/&gt;/gi, '>')
        .replace(/\r\n?/g, '\n').trim();
    }
    function calcTime(text) {
      const length = String(text || '').length;
      return Math.max(MIN_TIME, Math.min(MIN_TIME + length * 35, MAX_TIME));
    }
    // Mantiene ogni comunicazione su UNA sola schermata.
    // La dimensione è quella standard, tranne nei casi in cui il testo
    // non entra nell’area bianca: allora diminuisce soltanto quanto serve.
    function fitDescription() {
      descEl.style.fontSize = '';
      const standard = parseFloat(getComputedStyle(descEl).fontSize);
      if (descEl.scrollHeight <= descBox.clientHeight + 1 &&
          descEl.scrollWidth <= descBox.clientWidth + 1) return;
      let low = 1, high = standard;
      for (let i = 0; i < 18; i++) {
        const mid = (low + high) / 2;
        descEl.style.fontSize = mid + 'px';
        if (descEl.scrollHeight <= descBox.clientHeight + 1 &&
            descEl.scrollWidth <= descBox.clientWidth + 1) low = mid;
        else high = mid;
      }
      descEl.style.fontSize = low + 'px';
    }
    function showNews(animate = true) {
      clearTimeout(rotateTimeout);
      if (!news.length) return;
      const item = news[current];
      titleEl.classList.remove('show');
      descEl.classList.remove('show');
      titleEl.textContent = item.title || '';
      descEl.textContent = plainText(item.description);
      fitDescription();
      void titleEl.offsetWidth;
      if (animate) {
        titleEl.classList.add('show');
        descEl.classList.add('show');
      } else {
        titleEl.style.opacity = '1';
        titleEl.style.transform = 'none';
        descEl.style.opacity = '1';
        descEl.style.transform = 'none';
      }
      if (news.length > 1) {
        rotateTimeout = setTimeout(advance, calcTime(descEl.textContent));
      }
    }
    function advance() {
      if (news.length < 2) return;
      current = (current + 1) % news.length;
      showNews();
    }
    function normalize(data) {
      return Array.isArray(data) ? data.filter(x => x && (x.title || x.description)) : [];
    }
    // La cache viene mostrata una volta sola. All'arrivo del feed non
    // ripartiamo da capo se la news mostrata è ancora presente.
    try {
      news = normalize(JSON.parse(localStorage.getItem(CACHE_KEY)));
    } catch (_) { news = []; }
    if (news.length) showNews();

    async function loadNews() {
      try {
        const response = await fetch(API_URL + '?t=' + Date.now(), {cache: 'no-store'});
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const incoming = normalize(await response.json());
        if (!incoming.length) return;
        const before = JSON.stringify(news);
        const after = JSON.stringify(incoming);
        if (before === after) return; // Evita il doppio avvio della prima news.
        const currentKey = news[current] ? JSON.stringify(news[current]) : null;
        news = incoming;
        try { localStorage.setItem(CACHE_KEY, after); } catch (_) {}
        const sameIndex = currentKey ? news.findIndex(x => JSON.stringify(x) === currentKey) : -1;
        if (sameIndex >= 0) {
          current = sameIndex;
          // Non interrompere né ripetere la notizia già in lettura.
        } else {
          current = 0;
          showNews();
        }
      } catch (e) {
        console.warn('News: impossibile aggiornare, utilizzo i dati disponibili', e);
      }
    }
    loadNews();
    setInterval(loadNews, 60000);
    window.addEventListener('resize', () => {
      if (news.length) showNews();
    });
  </script>
</body>
</html>
